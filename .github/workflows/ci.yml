name: Build and test

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  security:
    uses: ./.github/workflows/security.yml

  codeql-actions:
    name: CodeQL for GitHub Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize workflow analysis
        uses: github/codeql-action/init@f051dc808ef3645eb0d08647ec751634ec2304ac
        with:
          languages: actions
          queries: security-extended
      - name: Analyze GitHub Actions
        uses: github/codeql-action/analyze@f051dc808ef3645eb0d08647ec751634ec2304ac
        with:
          category: /language:actions
          output: ${{ runner.temp }}/codeql-actions
      - name: Reject workflow security findings
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          files = list((Path(os.environ['RUNNER_TEMP']) / 'codeql-actions').glob('*.sarif'))
          if not files:
              raise SystemExit('CodeQL did not produce a workflow analysis result.')
          findings = 0
          for path in files:
              for run in json.loads(path.read_text())['runs']:
                  for result in run.get('results', []):
                      print(f"{result['ruleId']}: {result['message']['text']}")
                      if result.get('level', 'warning') in ('warning', 'error'):
                          findings += 1
          if findings:
              raise SystemExit(f'{findings} workflow findings require review and correction.')
          PY

  encoding:
    name: Encoding sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          g++ -std=c++20 -g -fsanitize=address,undefined -I OpenHashTab/OpenHashTab tests/EncodingTests.cpp OpenHashTab/OpenHashTab/base64.cpp -o "$RUNNER_TEMP/encoding-tests"
          "$RUNNER_TEMP/encoding-tests"
      - name: Verify independent algorithm vectors
        run: python3 tests/GenerateHashVectors.py --check

  build:
    name: Build x86, x64 and ARM64
    runs-on: windows-2025
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check release version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'The release tag must match VERSION.'
          }
      - name: Initialize CodeQL for compiled C/C++
        uses: github/codeql-action/init@f051dc808ef3645eb0d08647ec751634ec2304ac
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
      - name: Install SDK and WDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($id in @('Microsoft.WindowsSDK.10.0.26100', 'Microsoft.WindowsWDK.10.0.26100')) {
            winget install --source winget --exact --id $id --disable-interactivity --accept-source-agreements --accept-package-agreements
            if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne -1978335189) { throw "winget failed: $id ($LASTEXITCODE)" }
          }
          'WindowsTargetPlatformVersion=10.0.26100.0' >> $env:GITHUB_ENV
      - name: Build and run native x86/x64 tests
        shell: pwsh
        run: ./build_all.ps1
      - name: Analyze compiled C/C++ with CodeQL
        uses: github/codeql-action/analyze@f051dc808ef3645eb0d08647ec751634ec2304ac
        with:
          category: /language:c-cpp
          output: ${{ runner.temp }}/codeql-results
      - name: Reject high and critical CodeQL findings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $findings = 0
          $files = @(Get-ChildItem "$env:RUNNER_TEMP/codeql-results/*.sarif")
          if ($files.Count -eq 0) { throw 'CodeQL did not produce an analysis result.' }
          foreach ($file in $files) {
            $sarif = Get-Content $file -Raw | ConvertFrom-Json
            foreach ($run in $sarif.runs) {
              foreach ($result in $run.results) {
                $rule = $run.tool.driver.rules[$result.ruleIndex]
                $severity = [double]$rule.properties.'security-severity'
                Write-Host "$($result.ruleId): severity $severity; $($result.message.text)"
                if ($severity -ge 7) { ++$findings }
              }
            }
          }
          if ($findings) { throw "$findings high/critical CodeQL findings require review and correction." }
      - name: Check restored NuGet packages and source dependencies
        run: python automation/Check-Vulnerabilities.py --assets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-candidate
          path: install/*.msi
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-and-tests
          path: |
            build/oht-*/*.dll
            build/oht-*/*.exe
            build/oht-*/*.pdb
            build/oht-*/Tests/*.exe
            build/oht-*/Tests/*.dll
          if-no-files-found: error

  baseline:
    name: Build previous installer for upgrade tests
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 705a66c8cd85fdd818f4aff60c2b20a0ec3e1658
          submodules: recursive
          persist-credentials: false
      - name: Install baseline SDK and WDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($id in @('Microsoft.WindowsSDK.10.0.26100', 'Microsoft.WindowsWDK.10.0.26100')) {
            winget install --source winget --exact --id $id --disable-interactivity --accept-source-agreements --accept-package-agreements
            if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne -1978335189) { throw "winget failed: $id ($LASTEXITCODE)" }
          }
          'WindowsTargetPlatformVersion=10.0.26100.0' >> $env:GITHUB_ENV
      - name: Build the pinned original source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./build_all.ps1
          if (@(Get-ChildItem install/*.msi).Count -ne 6) { throw 'The baseline must contain six installers.' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: previous-installers-test-only
          path: install/*.msi
          if-no-files-found: error
          retention-days: 1

  arm64:
    name: Native Windows 11 ARM64 tests
    needs: [build, baseline]
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries-and-tests
          path: binaries
      - name: Verify OS and run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $os = Get-CimInstance Win32_OperatingSystem
          $os | Select-Object Caption, Version, BuildNumber, OSArchitecture | Format-List
          if ($os.Caption -notmatch 'Windows 11' -or [int]$os.BuildNumber -lt 22000) { throw 'A Windows 11 client is required.' }
          & ./binaries/oht-arm64/Tests/CoreTests.exe
          & ./binaries/oht-arm64/Tests/EncodingTests.exe

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installers-candidate
          path: installers
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: previous-installers-test-only
          path: baseline
      - name: ARM64 installer lifecycle
        shell: pwsh
        run: ./automation/Test-Install.ps1 -Stage All -Architecture arm64

  windows11:
    needs: [build, baseline]
    uses: ./.github/workflows/windows11.yml

  package:
    name: Package verified release candidate
    needs: [security, codeql-actions, encoding, build, arm64, windows11]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installers-candidate
          path: installers
      - name: Package binaries, licenses, source and SHA-256 checksums
        run: python3 automation/Package.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Windows11-release-candidate
          path: candidate/*
          if-no-files-found: error
