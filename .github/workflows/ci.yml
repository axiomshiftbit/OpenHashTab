name: Build and test

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
    inputs:
      diagnostic_build_run:
        description: 'Optional same-repository run ID: retest its ARM64 installers only; never package a candidate'
        type: string
        default: ''
      defer_windows_vm:
        description: 'Build and test native binaries for manual GUI review; defer x64 Windows VM admission and packaging'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  security:
    uses: ./.github/workflows/security.yml

  codeql-actions:
    name: CodeQL for GitHub Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize workflow analysis
        uses: github/codeql-action/init@f051dc808ef3645eb0d08647ec751634ec2304ac
        with:
          languages: actions
          queries: security-extended
      - name: Analyze GitHub Actions
        uses: github/codeql-action/analyze@f051dc808ef3645eb0d08647ec751634ec2304ac
        with:
          category: /language:actions
          output: ${{ runner.temp }}/codeql-actions
      - name: Reject workflow security findings
        run: python3 automation/Check-CodeQL.py "$RUNNER_TEMP/codeql-actions"

  encoding:
    name: Encoding and CRC64 sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -I OpenHashTab/OpenHashTab -I Algorithms/crc64 tests/EncodingTests.cpp OpenHashTab/OpenHashTab/base64.cpp Algorithms/crc64/crc64.cpp -o "$RUNNER_TEMP/encoding-tests"
          timeout 180 "$RUNNER_TEMP/encoding-tests"
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -I OpenHashTab/OpenHashTab tests/ReportTests.cpp OpenHashTab/OpenHashTab/Report.cpp -o "$RUNNER_TEMP/report-tests"
          timeout 180 "$RUNNER_TEMP/report-tests"
      - name: Test additional hashes under sanitizers
        run: |
          git submodule update --init --depth 1 Algorithms/XKCP/XKCP
          cmake -S tests/portable -B "$RUNNER_TEMP/portable-hashes" -G Ninja
          cmake --build "$RUNNER_TEMP/portable-hashes" --parallel 4
          ctest --test-dir "$RUNNER_TEMP/portable-hashes" --output-on-failure
      - name: Test the CodeQL result gate
        run: python3 -m unittest discover -s tests -p 'test_codeql*.py' -v
      - name: Verify GUI translations and English fallback
        run: python3 -m unittest discover -s tests -p test_localization.py -v
      - name: Verify independent algorithm vectors
        run: python3 tests/GenerateHashVectors.py --check

  build:
    if: ${{ inputs.diagnostic_build_run == '' }}
    name: Build x86, x64 and ARM64
    runs-on: windows-2022
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check release version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'The release tag must match VERSION.'
          }
      - name: Verify the checked XKCP source patch
        run: python -m unittest discover -s tests -p test_xkcp_patch.py -v
      - name: Test security event checks on Windows PowerShell 5.1
        shell: powershell
        run: |
          ./tests/Test-DefenderScan.ps1
          ./tests/Test-BehaviorEvents.ps1
      - name: Initialize CodeQL for compiled C/C++
        id: codeql
        uses: github/codeql-action/init@f051dc808ef3645eb0d08647ec751634ec2304ac
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
          trap-caching: false
          debug: true
          db-location: ${{ runner.temp }}/codeql-database
      - name: Verify the installed SDK and WDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = Get-ItemPropertyValue 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots' -Name KitsRoot10
          foreach ($architecture in @('x86', 'x64', 'arm64')) {
            $library = Join-Path $sdk "Lib/10.0.26100.0/um/$architecture/ntdllp.lib"
            if (-not (Test-Path $library)) { throw "The installed WDK is incomplete: $library" }
          }
          if (-not (Test-Path (Join-Path $sdk 'Include/10.0.26100.0/um/Windows.h'))) { throw 'Windows SDK 26100 is missing.' }
          "WindowsSdkDir=$sdk" >> $env:GITHUB_ENV
          'WindowsTargetPlatformVersion=10.0.26100.0' >> $env:GITHUB_ENV
      - name: Build and run native x86/x64 tests
        shell: pwsh
        run: |
          # CodeQL documents Microsoft extension support through VS 2022.
          # Do not silently switch the STL/ATL headers when a newer VS is installed.
          $env:VSINSTALLDIR = & vswhere -latest -version '[17.0,18.0)' -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $env:VSINSTALLDIR) { throw 'Visual Studio 2022 is required for the analyzed build.' }
          ./build_all.ps1 -DisablePrecompiledHeaders -Compiler MSVC
      - name: Analyze compiled C/C++ with CodeQL
        id: codeql_analysis
        uses: github/codeql-action/analyze@f051dc808ef3645eb0d08647ec751634ec2304ac
        with:
          category: /language:c-cpp
          output: ${{ runner.temp }}/codeql-results
      - name: Reject CodeQL findings
        shell: pwsh
        run: python automation/Check-CodeQL.py "$env:RUNNER_TEMP/codeql-results"
      - name: Require complete C/C++ extraction
        if: ${{ !cancelled() && steps.codeql_analysis.outcome == 'success' }}
        shell: pwsh
        env:
          CODEQL_CLI: ${{ steps.codeql.outputs.codeql-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:CODEQL_CLI pack ci automation/codeql
          & $env:CODEQL_CLI query run --database="$env:RUNNER_TEMP/codeql-database/cpp" --output="$env:RUNNER_TEMP/extraction.bqrs" automation/codeql/ExtractionCoverage.ql
          & $env:CODEQL_CLI bqrs decode --format=csv --output="$env:RUNNER_TEMP/extraction.csv" "$env:RUNNER_TEMP/extraction.bqrs"
          python automation/Check-CodeQLCoverage.py "$env:RUNNER_TEMP/extraction.csv"
          & $env:CODEQL_CLI query run --database="$env:RUNNER_TEMP/codeql-database/cpp" --output="$env:RUNNER_TEMP/diagnostics.bqrs" automation/codeql/ExtractionDiagnostics.ql
          & $env:CODEQL_CLI bqrs decode --format=csv --output="$env:RUNNER_TEMP/diagnostics.csv" "$env:RUNNER_TEMP/diagnostics.bqrs"
          python automation/Check-CodeQL.py "$env:RUNNER_TEMP/codeql-results" "$env:RUNNER_TEMP/diagnostics.csv"
      - name: Check restored NuGet packages and source dependencies
        run: python automation/Check-Vulnerabilities.py --assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-candidate
          path: install/*.msi
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-and-tests
          path: |
            build/oht-*/*.dll
            build/oht-*/*.exe
            build/oht-*/*.pdb
            build/oht-*/Tests/*.exe
            build/oht-*/Tests/*.dll
          if-no-files-found: error

  baseline:
    if: ${{ inputs.diagnostic_build_run == '' }}
    name: Build previous installer for upgrade tests
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 705a66c8cd85fdd818f4aff60c2b20a0ec3e1658
          submodules: recursive
          persist-credentials: false
      - name: Install baseline SDK and WDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($id in @('Microsoft.WindowsSDK.10.0.26100', 'Microsoft.WindowsWDK.10.0.26100')) {
            winget install --source winget --exact --id $id --disable-interactivity --accept-source-agreements --accept-package-agreements
            if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne -1978335189) { throw "winget failed: $id ($LASTEXITCODE)" }
          }
          'WindowsTargetPlatformVersion=10.0.26100.0' >> $env:GITHUB_ENV
      - name: Build the pinned original source
        shell: pwsh
        env:
          CI_VERSION: '3.1.1'
          CI_VERSION_MAJOR: '3'
          CI_VERSION_MINOR: '1'
          CI_VERSION_PATCH: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./build_all.ps1
          if (@(Get-ChildItem install/*.msi).Count -ne 6) { throw 'The baseline must contain six installers.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: previous-installers-test-only
          path: install/*.msi
          if-no-files-found: error
          retention-days: 1

  installer-diagnostic:
    name: ARM64 installer diagnostics (not release admission)
    if: ${{ inputs.diagnostic_build_run != '' }}
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate source run ID
        shell: pwsh
        env:
          BUILD_RUN: ${{ inputs.diagnostic_build_run }}
        run: |
          if ($env:BUILD_RUN -notmatch '^\d+$') { throw 'A numeric Actions run ID is required.' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-and-tests
          path: binaries
          run-id: ${{ inputs.diagnostic_build_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installers-candidate
          path: installers
          run-id: ${{ inputs.diagnostic_build_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: previous-installers-test-only
          path: baseline
          run-id: ${{ inputs.diagnostic_build_run }}
          github-token: ${{ github.token }}
      - name: Diagnose installer lifecycle using Windows PowerShell 5.1
        shell: powershell
        run: ./automation/Test-Install.ps1 -Stage All -Architecture arm64

  arm64:
    name: Native Windows 11 ARM64 tests
    needs: [build, baseline]
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-and-tests
          path: binaries
      - name: Verify OS and run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $os = Get-CimInstance Win32_OperatingSystem
          $os | Select-Object Caption, Version, BuildNumber, OSArchitecture | Format-List
          if ($os.Caption -notmatch 'Windows 11' -or [int]$os.BuildNumber -lt 22000) { throw 'A Windows 11 client is required.' }
          & ./binaries/oht-arm64/Tests/ShellTests.exe --load-only (Resolve-Path ./binaries/oht-arm64/OpenHashTab64.dll).Path
          & ./binaries/oht-arm64/Tests/ShellTests.exe --windows-control
          & ./binaries/oht-arm64/Tests/CoreTests.exe
          & ./binaries/oht-arm64/Tests/EncodingTests.exe
          & ./binaries/oht-arm64/Tests/ExtendedHashTests.exe
          & ./binaries/oht-arm64/Tests/ReportTests.exe
          & ./binaries/oht-arm64/Tests/BatchTests.exe
          & ./automation/Test-CLI.ps1 -Executable ./binaries/oht-arm64/OpenHashTabCLI.exe
          python tests/CliTests.py --exe ./binaries/oht-arm64/OpenHashTabCLI.exe

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installers-candidate
          path: installers
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: previous-installers-test-only
          path: baseline
      - name: ARM64 installer lifecycle
        shell: pwsh
        run: ./automation/Test-Install.ps1 -Stage All -Architecture arm64

  windows11:
    if: ${{ !inputs.defer_windows_vm }}
    needs: [build, baseline]
    uses: ./.github/workflows/windows11.yml

  package:
    name: Package verified release candidate
    needs: [security, codeql-actions, encoding, build, arm64, windows11]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installers-candidate
          path: installers
      - name: Package binaries, licenses, source and SHA-256 checksums
        run: python3 automation/Package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows11-release-candidate
          path: candidate/*
          if-no-files-found: error
