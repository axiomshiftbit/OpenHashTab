name: Retest selected Windows 11 images
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful build artifacts to reuse (same product/build inputs required)
        type: string
        required: true
      windows_version:
        description: Windows 11 image to retest; both are required to package a candidate
        type: choice
        options: [windows-11-26h2, windows-11-25h2, both]
        default: windows-11-26h2
permissions:
  contents: read
  actions: read
jobs:
  provenance:
    name: Verify unchanged product and completed prerequisites
    runs-on: ubuntu-24.04
    outputs:
      build_commit: ${{ steps.verify.outputs.build_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_reused_build.py -v
      - id: verify
        env:
          BUILD_RUN: ${{ inputs.build_run }}
          GH_TOKEN: ${{ github.token }}
        run: python3 automation/Check-ReusedBuild.py
  control:
    name: Test snapshot persistence and rebuild Windows-only control
    needs: provenance
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the actual snapshot format on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Test-BehaviorEvents.ps1
      - uses: github/codeql-action/init@f051dc808ef3645eb0d08647ec751634ec2304ac
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
          trap-caching: false
      - name: Compile and exercise only the independent Windows control
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & vswhere -latest -version '[17.0,18.0)' -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio 2022 is required.' }
          @(
              "call `"$vs\VC\Auxiliary\Build\vcvarsall.bat`" amd64",
              'if errorlevel 1 exit /b %ERRORLEVEL%',
              'cl.exe /nologo /std:c++20 /EHsc /MT /DUNICODE /D_UNICODE /Fe:WindowsShellControl.exe tests\ShellTests.cpp ole32.lib shell32.lib shlwapi.lib uuid.lib comctl32.lib urlmon.lib user32.lib',
              'exit /b %ERRORLEVEL%'
          ) | Set-Content control.cmd
          & cmd.exe /d /c control.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Control compilation failed.' }
          & ./WindowsShellControl.exe --windows-control
          if ($LASTEXITCODE -ne 0) { throw 'Control execution failed.' }
      - uses: github/codeql-action/analyze@f051dc808ef3645eb0d08647ec751634ec2304ac
        with:
          category: /language:c-cpp-windows-control
          output: ${{ runner.temp }}/codeql-control
      - name: Reject findings in the changed Windows control
        shell: pwsh
        run: python automation/Check-CodeQL.py "$env:RUNNER_TEMP/codeql-control"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-shell-control
          path: WindowsShellControl.exe
          if-no-files-found: error
  codeql-actions:
    name: CodeQL for changed workflows
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@f051dc808ef3645eb0d08647ec751634ec2304ac
        with:
          languages: actions
          queries: security-extended
      - uses: github/codeql-action/analyze@f051dc808ef3645eb0d08647ec751634ec2304ac
        with:
          category: /language:actions
          output: ${{ runner.temp }}/codeql-actions
      - run: python3 automation/Check-CodeQL.py "$RUNNER_TEMP/codeql-actions"
  windows11:
    needs: [provenance, control]
    uses: ./.github/workflows/windows11.yml
    with:
      build_run: ${{ inputs.build_run }}
      control_run: ${{ format('{0}', github.run_id) }}
      windows_version: ${{ inputs.windows_version }}
  package:
    name: Package the reused and retested installers
    if: inputs.windows_version == 'both'
    needs: [provenance, codeql-actions, windows11]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installers-candidate
          path: installers
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Package the exact tested binaries with source and provenance
        env:
          BUILD_RUN: ${{ inputs.build_run }}
          BUILD_COMMIT: ${{ needs.provenance.outputs.build_commit }}
        run: python3 automation/Package.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Windows11-release-candidate
          path: candidate/*
          if-no-files-found: error
