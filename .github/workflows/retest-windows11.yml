name: Retest selected Windows 11 images
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful build artifacts to reuse (same product/build inputs required)
        type: string
        required: true
      windows_version:
        description: Windows 11 image to retest
        type: choice
        options: [windows-11-26h2, windows-11-25h2, both]
        default: windows-11-26h2
      passed_vm_run:
        description: Optional prior retest with the other image successful (verified before reuse)
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  provenance:
    name: Verify unchanged product and completed prerequisites
    runs-on: windows-2022
    outputs:
      build_commit: ${{ steps.verify.outputs.build_commit }}
      original_build_run: ${{ steps.verify.outputs.original_build_run }}
      control_run: ${{ steps.verify.outputs.control_run }}
      passed_vm: ${{ steps.verify.outputs.passed_vm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python -m unittest discover -s tests -p test_reused_build.py -v
      - name: Test registry policy and snapshot persistence on PowerShell 5.1
        shell: powershell
        run: ./tests/Test-BehaviorEvents.ps1
      - id: verify
        env:
          BUILD_RUN: ${{ inputs.build_run }}
          PASSED_VM_RUN: ${{ inputs.passed_vm_run }}
          WINDOWS_VERSION: ${{ inputs.windows_version }}
          GH_TOKEN: ${{ github.token }}
        run: python automation/Check-ReusedBuild.py
  control:
    name: Test snapshot persistence and rebuild Windows-only control
    needs: provenance
    if: needs.provenance.outputs.control_run == ''
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
          trap-caching: false
      - name: Compile and exercise only the independent Windows control
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & vswhere -latest -version '[17.0,18.0)' -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio 2022 is required.' }
          @(
              "call `"$vs\VC\Auxiliary\Build\vcvarsall.bat`" amd64",
              'if errorlevel 1 exit /b %ERRORLEVEL%',
              'cl.exe /nologo /std:c++20 /EHsc /MT /DUNICODE /D_UNICODE /I Algorithms /Fe:WindowsShellControl.exe tests\ShellTests.cpp ole32.lib shell32.lib shlwapi.lib uuid.lib comctl32.lib urlmon.lib user32.lib gdi32.lib',
              'exit /b %ERRORLEVEL%'
          ) | Set-Content control.cmd
          & cmd.exe /d /c control.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Control compilation failed.' }
          & ./WindowsShellControl.exe --windows-control
          if ($LASTEXITCODE -ne 0) { throw 'Control execution failed.' }
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: /language:c-cpp-windows-control
          output: ${{ runner.temp }}/codeql-control
      - name: Reject findings in the changed Windows control
        shell: pwsh
        run: python automation/Check-CodeQL.py "$env:RUNNER_TEMP/codeql-control"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-shell-control
          path: WindowsShellControl.exe
          if-no-files-found: error
  codeql-actions:
    name: CodeQL for changed workflows
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          languages: actions
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: /language:actions
          output: ${{ runner.temp }}/codeql-actions
      - run: python3 automation/Check-CodeQL.py "$RUNNER_TEMP/codeql-actions"
  windows11:
    needs: [provenance, control]
    if: ${{ !cancelled() && needs.provenance.result == 'success' && (needs.control.result == 'success' || needs.provenance.outputs.control_run != '') }}
    uses: ./.github/workflows/windows11.yml
    with:
      build_run: ${{ inputs.build_run }}
      control_run: ${{ needs.provenance.outputs.control_run || format('{0}', github.run_id) }}
      windows_version: ${{ inputs.windows_version }}
  package:
    name: Package the reused and retested installers
    if: ${{ !cancelled() && needs.provenance.result == 'success' && needs.codeql-actions.result == 'success' && needs.windows11.result == 'success' && (inputs.windows_version == 'both' || needs.provenance.outputs.passed_vm != '') }}
    needs: [provenance, codeql-actions, windows11]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installers-candidate
          path: installers
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Package the exact tested binaries with source and provenance
        env:
          BUILD_RUN: ${{ needs.provenance.outputs.original_build_run }}
          ARTIFACT_RUN: ${{ inputs.build_run }}
          BUILD_COMMIT: ${{ needs.provenance.outputs.build_commit }}
          PASSED_VM: ${{ needs.provenance.outputs.passed_vm }}
        run: python3 automation/Package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows11-release-candidate
          path: candidate/*
          if-no-files-found: error
