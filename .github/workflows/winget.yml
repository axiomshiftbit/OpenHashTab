name: Publish to Winget

on:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'namazso/OpenHashTab'
    runs-on: ubuntu-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54
        with:
          identifier: namazso.OpenHashTab
          token: ${{ secrets.WINGET_TOKEN }}
          fork-user: namazso-bot
