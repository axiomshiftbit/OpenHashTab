name: Publish to Winget

on:
  release:
    types: [released]

jobs:
  publish:
    if: github.repository == 'namazso/OpenHashTab'
    runs-on: ubuntu-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: namazso.OpenHashTab
          token: ${{ secrets.WINGET_TOKEN }}
          fork-user: namazso-bot
