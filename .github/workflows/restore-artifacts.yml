name: Restore accidentally deleted build artifacts
on:
  workflow_dispatch:
    inputs:
      original_run:
        description: Deleted original build run
        type: string
        required: true
      verification_run:
        description: Retest run that verified the original build before deletion
        type: string
        required: true
      recovery_release:
        description: Draft release containing the three preserved ZIP archives
        type: string
        required: true
      archive_hashes:
        description: Reviewed SHA-256 JSON object, keyed by artifact name without .zip
        type: string
        required: true
permissions:
  # GitHub exposes unpublished draft assets only to users with push access.
  contents: write
  actions: read
jobs:
  restore:
    name: Restore verified build artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify original admission and preserve exact local backup bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ inputs.original_run }}
          VERIFICATION_RUN: ${{ inputs.verification_run }}
          RECOVERY_RELEASE: ${{ inputs.recovery_release }}
          ARCHIVE_HASHES: ${{ inputs.archive_hashes }}
        run: python3 automation/Restore-Artifacts.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-and-tests
          path: recovered/binaries-and-tests/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-candidate
          path: recovered/installers-candidate/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: previous-installers-test-only
          path: recovered/previous-installers-test-only/
          if-no-files-found: error
