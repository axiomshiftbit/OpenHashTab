name: Windows 11 lifecycle
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  client:
    name: ${{ matrix.os }} x64
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-25h2, windows-11-26h2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries-and-tests
          path: binaries
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installers-candidate
          path: installers
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: previous-installers-test-only
          path: baseline
      - name: Install, update, repair, launch and uninstall on Windows 11
        env:
          CLIENT_OS: ${{ matrix.os }}
        run: bash automation/client/Run.sh
